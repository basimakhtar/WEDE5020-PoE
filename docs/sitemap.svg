<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="Sitemap of the VoltStream website">
  <title>VoltStream Plumbing and Electrical - website sitemap</title>

  <!-- connector lines from Home to the four pages -->
  <g stroke="#0b4f8a" stroke-width="2" fill="none">
    <path d="M 380 80 L 95 160"/>
    <path d="M 380 80 L 285 160"/>
    <path d="M 380 80 L 475 160"/>
    <path d="M 380 80 L 665 160"/>
  </g>

  <!-- Home -->
  <rect x="280" y="20" width="200" height="60" rx="10" fill="#0b4f8a"/>
  <text x="380" y="48" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="bold">Home</text>
  <text x="380" y="66" text-anchor="middle" fill="#cfe3f5" font-family="Arial, sans-serif" font-size="11">index.html</text>

  <!-- About Us -->
  <rect x="15" y="160" width="160" height="60" rx="10" fill="#1e90c8"/>
  <text x="95" y="188" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="bold">About Us</text>
  <text x="95" y="206" text-anchor="middle" fill="#e8f4fb" font-family="Arial, sans-serif" font-size="11">about.html</text>

  <!-- Services -->
  <rect x="205" y="160" width="160" height="60" rx="10" fill="#1e90c8"/>
  <text x="285" y="188" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Services</text>
  <text x="285" y="206" text-anchor="middle" fill="#e8f4fb" font-family="Arial, sans-serif" font-size="11">services.html</text>

  <!-- Enquiry -->
  <rect x="395" y="160" width="160" height="60" rx="10" fill="#1e90c8"/>
  <text x="475" y="188" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Enquiry</text>
  <text x="475" y="206" text-anchor="middle" fill="#e8f4fb" font-family="Arial, sans-serif" font-size="11">enquiry.html</text>

  <!-- Contact -->
  <rect x="585" y="160" width="160" height="60" rx="10" fill="#1e90c8"/>
  <text x="665" y="188" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Contact</text>
  <text x="665" y="206" text-anchor="middle" fill="#e8f4fb" font-family="Arial, sans-serif" font-size="11">contact.html</text>

  <!-- note about the shared navigation -->
  <rect x="150" y="260" width="460" height="44" rx="8" fill="#fdf3e0" stroke="#f5a623" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="380" y="278" text-anchor="middle" fill="#7a5200" font-family="Arial, sans-serif" font-size="12">Every page links to every other page through the</text>
  <text x="380" y="294" text-anchor="middle" fill="#7a5200" font-family="Arial, sans-serif" font-size="12">shared main navigation menu in the header and footer.</text>
</svg>
